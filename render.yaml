services:
  - type: web
    name: algorithmic
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algorithmic-db
          property: connectionString

databases:
  - name: algorithmic-db
    databaseName: algorithmic
    user: algorithmic
