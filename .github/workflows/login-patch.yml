name: Login patch
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch login handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '        async function handleLogin(event) {'
          start = s.find(marker)
          if start < 0: raise SystemExit('handleLogin not found')
          brace = s.find('{', start); depth = 0; end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0: end = i + 1; break
          if end is None: raise SystemExit('could not parse handleLogin')
          new = '''        async function handleLogin(event) {
            event.preventDefault();
            const form = document.getElementById('loginForm');
            const errorEl = document.getElementById('loginError');
            const button = form?.querySelector('button[type="submit"]');
            const emailEl = document.getElementById('loginEmail');
            const passwordEl = document.getElementById('loginPassword');
            if (!errorEl || !emailEl || !passwordEl) return;
            errorEl.textContent = '';
            const email = emailEl.value.trim().toLowerCase();
            const password = passwordEl.value;
            if (!email || !password) { errorEl.textContent = 'Please enter your email and password.'; return; }
            if (button) { button.disabled = true; button.textContent = 'Logging in…'; button.style.opacity = '0.7'; }
            try {
                const res = await fetch('/api/auth/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify({ email, password }) });
                const contentType = res.headers.get('content-type') || '';
                const data = contentType.includes('application/json') ? await res.json().catch(() => ({})) : {};
                if (!res.ok) {
                    const detail = typeof data.detail === 'string' ? data.detail : Array.isArray(data.detail) ? data.detail.map(x => x?.msg || String(x)).join(', ') : `Login failed (HTTP ${res.status}).`;
                    errorEl.textContent = detail;
                    return;
                }
                if (!data || typeof data !== 'object' || !data.institute_name) { errorEl.textContent = 'Login succeeded but the server returned an invalid session response. Please refresh and try again.'; return; }
                completeAuth(data);
            } catch (err) {
                console.error('Algorithmic login request failed:', err);
                errorEl.textContent = 'Unable to reach the login server. Please refresh the page and try again.';
            } finally {
                if (button) { button.disabled = false; button.textContent = 'Log In'; button.style.opacity = ''; }
            }
        }'''
          p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
      - name: Validate
        run: python -m py_compile main.py && git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix login request handling and session flow' || true
          git push || true
