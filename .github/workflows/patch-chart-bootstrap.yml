name: Add Chart bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'Add Chart bootstrap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bootstrap script tag
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/algorithmic_chart_boot.js"></script>'
          if tag not in s:
              s=s.replace('<script src="/algorithmic_fixes.js"></script>', tag+'\n<script src="/algorithmic_fixes.js"></script>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-chart-bootstrap.yml
          git rm -f .github/workflows/patch-chart-bootstrap.yml
          git commit -m "Add Chart bootstrap"
          git push
