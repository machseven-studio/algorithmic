name: Repair current modules

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patched backend
        run: python3 -m py_compile main.py
      - name: Validate patched frontend
        run: |
          grep -q 'algorithmic-requested-fixes-css' index.html
          grep -q 'algorithmic-requested-fixes-runtime' index.html
          grep -q 'const hadBranch=currentBranchId' index.html
