name: Repair current modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested fixes
        run: python3 apply_requested_fixes.py
      - name: Force Main Campus default
        run: python3 force_branch_default.py
      - name: Validate backend
        run: python3 -m py_compile main.py
      - name: Validate frontend
        run: |
          grep -q 'algorithmic-requested-fixes-css' index.html
          grep -q 'algorithmic-requested-fixes-runtime' index.html
          grep -q 'const hadBranch=currentBranchId' index.html
      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Main Campus default and requested fixes'
          git push
