name: Final Algorithmic repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source files
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------------- main.py ----------------
          p = Path('main.py')
          s = p.read_text(encoding='utf-8')
          marker = '# ALGORITHMIC_FINAL_REPAIR_V1'
          if marker not in s:
              s += r'''

# ALGORITHMIC_FINAL_REPAIR_V1
# One-time cleanup of the demonstration/seed records. The institute account,
# branches and staff credentials are intentionally preserved. A persistent flag
# prevents later application restarts from deleting information entered by users.
def _run_first_launch_data_cleanup():
    conn = get_conn()
    cur = conn.cursor()
    cur.execute("CREATE TABLE IF NOT EXISTS algorithmic_system_flags (flag TEXT PRIMARY KEY, created_at TIMESTAMPTZ NOT NULL DEFAULT NOW())")
    cur.execute("SELECT 1 FROM algorithmic_system_flags WHERE flag = %s", ("production_data_initialized",))
    already_initialized = cur.fetchone()
    if not already_initialized:
        # Operational records only; never delete institutes, branches, staff or sessions.
        for table in ("students", "teachers", "classrooms", "syllabus", "attendance", "timetables_slots", "timetable_configs", "exam_seatings", "invigilation", "fees", "audit_log"):
            cur.execute(f"DELETE FROM {table}")
        cur.execute("INSERT INTO algorithmic_system_flags (flag) VALUES (%s)", ("production_data_initialized",))
        conn.commit()
    cur.close()
    conn.close()

try:
    _run_first_launch_data_cleanup()
except Exception:
    # Never prevent the web application from starting because a cleanup flag
    # cannot be written on an unusual legacy database.
    pass
'''
              p.write_text(s, encoding='utf-8')

          # ---------------- index.html ----------------
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* ALGORITHMIC_FINAL_UI_V1 */'
          if marker not in s:
              css = r'''
<style>
/* ALGORITHMIC_FINAL_UI_V1 */
#headerInstituteName { font-size: clamp(2.35rem, 4vw, 4.4rem) !important; line-height: .95 !important; max-width: min(62vw, 980px); }
#dashboardWelcomeRow { min-height: 76px; }
#dashboardClockWidget { margin-left: auto; min-width: 255px; text-align: right; padding: 9px 0 9px 24px; }
#dashboardClockWidget .clock-time { font-family: 'Fraunces', serif; font-size: clamp(1.15rem, 1.8vw, 1.7rem); font-weight: 800; letter-spacing: .035em; }
#dashboardClockWidget .clock-date { margin-top: 3px; color: #9ca3af; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
#moduleSidebar { transition: width .18s ease, min-width .18s ease; position: relative; }
#moduleSidebar.sidebar-collapsed { width: 72px !important; min-width: 72px !important; }
#moduleSidebar.sidebar-collapsed .sidebar-label, #moduleSidebar.sidebar-collapsed .module-label, #moduleSidebar.sidebar-collapsed .module-head-group > div:first-child span:first-child { display:none !important; }
#moduleSidebar.sidebar-collapsed .sidebar-item { justify-content:center; padding-left:0 !important; padding-right:0 !important; border-left-width:0 !important; }
#moduleSidebar.sidebar-collapsed .sidebar-item > span:last-child { display:none; }
#moduleSidebar.sidebar-collapsed .module-head-group > div:first-child { justify-content:center; padding-left:0; padding-right:0; }
#sidebarCollapseButton { position:absolute; top:10px; right:-14px; z-index:20; width:28px; height:28px; border:1px solid rgba(212,175,55,.38); border-radius:999px; background:#0b0b0b; color:#e8c767; font-size:20px; line-height:24px; box-shadow:0 4px 12px rgba(0,0,0,.45); }
#sidebarCollapseButton:hover { border-color:#d4af37; }
#moduleGroups { display:flex; flex-direction:column; align-items:stretch; gap:2px; }
#moduleGroups .sidebar-item { min-height:42px; align-items:center; }
#moduleGroups .module-head-group { width:100%; }
#moduleGroups .module-head-group > div:first-child { min-height:38px; }
#moduleGroups .module-head-arrow { flex:0 0 auto; }
/* The old injected top-level History/Seating controls must never survive the canonical sidebar. */
#moduleGroups > .legacy-history, #moduleGroups > .legacy-seating, #moduleGroups [data-legacy-module='history'], #moduleGroups [data-legacy-module='seating'] { display:none !important; }
/* Give the timetable constraint workspace real working area. */
#teacherConfigList, #ttTimingRows { min-height:180px; max-height:52vh; overflow-y:auto; }
#teacherConfigList > div, #ttTimingRows > div { min-height:58px; }
.timetable-config-panel { min-height:420px !important; }
@media (max-width: 900px) { #dashboardClockWidget { text-align:left; margin-left:0; padding-left:0; } #headerInstituteName { max-width:75vw; } }
</style>
'''
              # Put styling before the closing head tag.
              s = s.replace('</head>', css + '\n</head>', 1)

              # Make the source file itself explicitly responsible for loading the
              # repair layer, while retaining the existing script if present.
              if '/algorithmic_fixes.js' not in s:
                  s = s.replace('</body>', '<script src="/algorithmic_fixes.js"></script>\n</body>', 1)

              # Add a small boot hook after the existing fixes so the final UI wins
              # over any legacy injected navigation.
              boot = r'''
<script>
(function(){
  function finalUiBoot(){
    try {
      if (typeof renderModuleGroups === 'function') renderModuleGroups();
      // Remove legacy standalone navigation entries by semantic label.
      document.querySelectorAll('#moduleGroups button, #moduleGroups a').forEach(function(el){
        var t=(el.textContent||'').trim().toLowerCase();
        if ((t==='history'||t==='seating') && !el.closest('.module-head-group')) el.remove();
      });
    } catch(e) {}
  }
  window.addEventListener('load', function(){ setTimeout(finalUiBoot, 0); setTimeout(finalUiBoot, 500); });
})();
</script>
'''
              s = s.replace('</body>', boot + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py index.html
          if git diff --cached --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git commit -m "Fix dashboard navigation, sidebar, timetable and production data initialization"
          git push
