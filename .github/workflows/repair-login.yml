name: Repair login

on:
  push:
    paths:
      - '.github/workflows/repair-login.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('        async function handleLogin(e) {')
          end = s.index('\n        async function handleSignup(e) {', start)
          replacement = '''        async function handleLogin(e) {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            const button = document.querySelector('#loginForm button[type="submit"]');
            const emailEl = document.getElementById('loginEmail');
            const passwordEl = document.getElementById('loginPassword');
            if (!errorEl || !emailEl || !passwordEl) return;

            errorEl.textContent = '';
            const email = emailEl.value.trim().toLowerCase();
            const password = passwordEl.value;
            if (!email || !password) {
                errorEl.textContent = 'Please enter your email and password.';
                return;
            }

            if (button) {
                button.disabled = true;
                button.dataset.originalText = button.textContent.trim();
                button.textContent = 'Logging in...';
                button.style.opacity = '0.7';
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const contentType = res.headers.get('content-type') || '';
                const data = contentType.includes('application/json')
                    ? await res.json().catch(() => ({}))
                    : {};

                if (!res.ok) {
                    let detail = data.detail;
                    if (Array.isArray(detail)) {
                        detail = detail.map(x => x && x.msg ? x.msg : String(x)).join(', ');
                    }
                    errorEl.textContent = detail || `Login failed (HTTP ${res.status}).`;
                    return;
                }

                if (!data || typeof data !== 'object' || !data.institute_name) {
                    errorEl.textContent = 'The server returned an invalid login response. Please refresh and try again.';
                    return;
                }

                completeAuth(data);
            } catch (err) {
                console.error('Algorithmic login request failed:', err);
                errorEl.textContent = 'Unable to reach the login server. Please refresh the page and try again.';
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = button.dataset.originalText || 'Log In';
                    button.style.opacity = '';
                }
            }
        }'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert "credentials: 'same-origin'" in s
          assert "async function handleLogin(e)" in s
          assert s.count("async function handleLogin(e)") == 1
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/repair-login.yml
          git commit -m 'Fix login request and session handling'
          git push
