name: Algorithmic source refactor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source refactor
        run: python tools/refactor_algorithmic.py
      - name: Validate Python
        run: python -m py_compile main.py
      - name: Commit application files and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Refactor Algorithmic frontend and seating flow'
          git push origin HEAD:main
