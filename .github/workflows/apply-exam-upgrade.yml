name: Apply exam upgrade

on:
  push:
    paths:
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final exam modules
        run: python tools/finalize_exam_modules.py

      - name: Validate Python
        run: python -m py_compile main.py

      - name: Commit patched application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py index.html
          if git diff --cached --quiet; then
            echo "No application changes needed"
          else
            git commit -m "Finalize Results and History examination modules"
            git push origin HEAD:main
          fi
