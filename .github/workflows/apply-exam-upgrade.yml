name: Apply exam upgrade

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'main.py'
      - 'index.html'
  push:
    paths:
      - 'tools/**'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply upgrade
        run: python tools/apply_exam_upgrade.py

      - name: Validate Python
        run: python -m py_compile main.py

      - name: Commit patched application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Results and History examination modules"
            git push origin HEAD:${GITHUB_HEAD_REF:-main}
          fi
