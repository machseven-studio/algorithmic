<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALGORITHMIC — Institutional Operations</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{font-family:Inter,sans-serif;background:#050505;color:#d4d4d4}.card{background:#0b0b0b;border:1px solid #1b1b1b;border-radius:12px}.input{background:#050505;border:1px solid #242424;border-radius:8px;padding:10px 12px;width:100%;outline:0;color:#eee}.input:focus{border-color:#8b6b2c}.btn{border:1px solid #292929;border-radius:8px;padding:9px 13px;font-size:12px}.gold{background:#b18a3a;color:#080808;border-color:#b18a3a;font-weight:700}.nav.active{background:#16120a;color:#d4af55;border-color:#392d18}.nav{border:1px solid transparent}.hidden{display:none!important}</style></head><body>
<div id="app"></div>
<script>
let token=localStorage.getItem('algorithmic_token')||'';
let me=null;
async function boot(){
  const x=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});
  if(!x.ok){localStorage.removeItem('algorithmic_token');token='';return;}
  me=await x.json();
  // Authentication is disabled for now. The existing authenticated application is intentionally not exposed until login is restored.
  document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-5"><div class="card p-8 max-w-md text-center"><div class="text-4xl font-extrabold tracking-tight text-[#c3a25b]">ALGORITHMIC</div><div class="text-sm text-zinc-400 mt-4">Authentication is temporarily disabled.</div></div></div>';
}
if(token)boot();else document.getElementById('app').innerHTML='<div class="min-h-screen grid place-items-center p-5"><div class="card p-8 max-w-md text-center"><div class="text-4xl font-extrabold tracking-tight text-[#c3a25b]">ALGORITHMIC</div><div class="text-sm text-zinc-400 mt-4">Authentication is temporarily disabled.</div></div></div>';
</script>
</body></html>
