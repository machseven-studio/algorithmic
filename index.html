<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #334155; }
        .sidebar h2 { color: #38bdf8; font-size: 1.2rem; margin-bottom: 20px; }
        .nav-btn { background: transparent; color: #94a3b8; border: none; padding: 12px; text-align: left; cursor: pointer; border-radius: 8px; font-weight: 600; }
        .nav-btn:hover, .nav-btn.active { background: #334155; color: #f8fafc; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .module { display: none; }
        .module.active { display: block; }
        
        /* Gold Welcome Header */
        .welcome-title {
            font-family: 'Cinzel', serif;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInWelcome 1.2s ease-in-out;
            margin-bottom: 30px;
        }
        @keyframes fadeInWelcome {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Controls & Inputs */
        .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        input, select { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 14px; border-radius: 6px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn:hover { background: #0369a1; }
        .btn-present { background: #16a34a; margin-right: 5px; }
        .btn-absent { background: #dc2626; }
        
        /* Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e293b; border-radius: 8px; overflow: hidden; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 0.85rem; }
        
        /* Batch Group Container */
        .batch-section { margin-bottom: 30px; background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; }
        .batch-header { font-size: 1.3rem; color: #38bdf8; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 8px; }

        /* Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 10px; width: 400px; display: flex; flex-direction: column; gap: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Institute Portal</h2>
        <button class="nav-btn active" onclick="showModule('home')">Home</button>
        <button class="nav-btn" onclick="showModule('students')">Student Department</button>
        <button class="nav-btn" onclick="showModule('teachers')">Teacher Department</button>
        <button class="nav-btn" onclick="showModule('syllabus')">Syllabus Department</button>
        <button class="nav-btn" onclick="showModule('attendance')">Attendance</button>
    </div>

    <div class="main-content">
        <!-- HOME MODULE -->
        <div id="home" class="module active">
            <h1 class="welcome-title">Welcome, Samarth Dave</h1>
        </div>

        <!-- STUDENT DEPARTMENT -->
        <div id="students" class="module">
            <h2>Student Department</h2>
            <div class="controls">
                <input type="text" id="studentSearch" placeholder="Search student name..." oninput="renderStudents()">
                <button class="btn" onclick="openModal('studentModal')">+ Add Student</button>
            </div>
            <div id="studentBatchContainer"></div>
        </div>

        <!-- TEACHER DEPARTMENT -->
        <div id="teachers" class="module">
            <h2>Teacher Department</h2>
            <div class="controls">
                <button class="btn" onclick="openModal('teacherModal')">+ Add Teacher</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Subject</th>
                        <th>Contact Number</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody"></tbody>
            </table>
        </div>

        <!-- SYLLABUS DEPARTMENT -->
        <div id="syllabus" class="module">
            <h2>Syllabus Department</h2>
            <div class="controls">
                <button class="btn" onclick="openModal('syllabusModal')">+ Add Syllabus Topic</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>SUBJECT</th>
                        <th>TOPIC</th>
                        <th>TEACHER'S NAME</th>
                        <th>NUMBER OF LECTURES</th>
                        <th>DATE</th>
                    </tr>
                </thead>
                <tbody id="syllabusTableBody"></tbody>
            </table>
        </div>

        <!-- ATTENDANCE MODULE -->
        <div id="attendance" class="module">
            <h2>Attendance Module</h2>
            <div class="controls">
                <select id="attendanceBatchSelect" onchange="renderAttendance()"></select>
                <input type="text" id="attendanceSearch" placeholder="Search student name..." oninput="renderAttendance()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- MODALS -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>Add Student</h3>
            <input type="text" id="s_name" placeholder="Name">
            <input type="text" id="s_batch" placeholder="Batch">
            <input type="text" id="s_roll" placeholder="Roll Number">
            <input type="text" id="s_contact" placeholder="Parent's Contact Number">
            <button class="btn" onclick="addStudent()">Save</button>
            <button class="btn btn-absent" onclick="closeModal('studentModal')">Cancel</button>
        </div>
    </div>

    <div id="teacherModal" class="modal">
        <div class="modal-content">
            <h3>Add Teacher</h3>
            <input type="text" id="t_name" placeholder="Name">
            <input type="text" id="t_subject" placeholder="Subject">
            <input type="text" id="t_contact" placeholder="Contact Number">
            <button class="btn" onclick="addTeacher()">Save</button>
            <button class="btn btn-absent" onclick="closeModal('teacherModal')">Cancel</button>
        </div>
    </div>

    <div id="syllabusModal" class="modal">
        <div class="modal-content">
            <h3>Add Syllabus Entry</h3>
            <input type="text" id="sy_subject" placeholder="SUBJECT">
            <input type="text" id="sy_topic" placeholder="TOPIC">
            <input type="text" id="sy_teacher" placeholder="TEACHER'S NAME">
            <input type="number" id="sy_lectures" placeholder="NUMBER OF LECTURES">
            <input type="date" id="sy_date" placeholder="DATE">
            <button class="btn" onclick="addSyllabus()">Save</button>
            <button class="btn btn-absent" onclick="closeModal('syllabusModal')">Cancel</button>
        </div>
    </div>

    <script>
        // Central Data Store
        let students = [
            { name: "Rahul Sharma", batch: "Batch A", roll: "101", parentContact: "9876543210" },
            { name: "Priya Patel", batch: "Batch B", roll: "102", parentContact: "9876543211" },
            { name: "Aman Verma", batch: "Batch A", roll: "103", parentContact: "9876543212" }
        ];
        let teachers = [];
        let syllabus = [];

        function showModule(id) {
            document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            if(id === 'students') renderStudents();
            if(id === 'teachers') renderTeachers();
            if(id === 'syllabus') renderSyllabus();
            if(id === 'attendance') setupAttendanceUI();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // STUDENT FUNCTIONS
        function addStudent() {
            const name = document.getElementById('s_name').value;
            const batch = document.getElementById('s_batch').value;
            const roll = document.getElementById('s_roll').value;
            const parentContact = document.getElementById('s_contact').value;
            if(name && batch) {
                students.push({ name, batch, roll, parentContact });
                closeModal('studentModal');
                renderStudents();
            }
        }

        function renderStudents() {
            const container = document.getElementById('studentBatchContainer');
            const search = document.getElementById('studentSearch').value.toLowerCase();
            container.innerHTML = '';

            // Get & Sort Unique Batches Alphabetically
            const batches = [...new Set(students.map(s => s.batch))].sort((a, b) => a.localeCompare(b));

            batches.forEach(batch => {
                const batchStudents = students.filter(s => s.batch === batch && s.name.toLowerCase().includes(search));
                if(batchStudents.length === 0) return;

                let section = document.createElement('div');
                section.className = 'batch-section';
                let html = `<div class="batch-header">${batch}</div><table><thead><tr><th>Name</th><th>Batch</th><th>Roll Number</th><th>Parent's Contact Number</th></tr></thead><tbody>`;
                
                batchStudents.forEach(s => {
                    html += `<tr><td>${s.name}</td><td>${s.batch}</td><td>${s.roll}</td><td>${s.parentContact}</td></tr>`;
                });
                html += `</tbody></table>`;
                section.innerHTML = html;
                container.appendChild(section);
            });
        }

        // TEACHER FUNCTIONS
        function addTeacher() {
            const name = document.getElementById('t_name').value;
            const subject = document.getElementById('t_subject').value;
            const contact = document.getElementById('t_contact').value;
            if(name) {
                teachers.push({ name, subject, contact });
                closeModal('teacherModal');
                renderTeachers();
            }
        }

        function renderTeachers() {
            const tbody = document.getElementById('teacherTableBody');
            tbody.innerHTML = teachers.map(t => `<tr><td>${t.name}</td><td>${t.subject}</td><td>${t.contact}</td></tr>`).join('');
        }

        // SYLLABUS FUNCTIONS
        function addSyllabus() {
            const subject = document.getElementById('sy_subject').value;
            const topic = document.getElementById('sy_topic').value;
            const teacher = document.getElementById('sy_teacher').value;
            const lectures = document.getElementById('sy_lectures').value;
            const date = document.getElementById('sy_date').value;
            if(subject) {
                syllabus.push({ subject, topic, teacher, lectures, date });
                closeModal('syllabusModal');
                renderSyllabus();
            }
        }

        function renderSyllabus() {
            const tbody = document.getElementById('syllabusTableBody');
            tbody.innerHTML = syllabus.map(s => `<tr><td>${s.subject}</td><td>${s.topic}</td><td>${s.teacher}</td><td>${s.lectures}</td><td>${s.date}</td></tr>`).join('');
        }

        // ATTENDANCE FUNCTIONS
        function setupAttendanceUI() {
            const select = document.getElementById('attendanceBatchSelect');
            const batches = [...new Set(students.map(s => s.batch))].sort((a, b) => a.localeCompare(b));
            select.innerHTML = batches.map(b => `<option value="${b}">${b}</option>`).join('');
            renderAttendance();
        }

        function renderAttendance() {
            const selectedBatch = document.getElementById('attendanceBatchSelect').value;
            const search = document.getElementById('attendanceSearch').value.toLowerCase();
            const tbody = document.getElementById('attendanceTableBody');
            
            const filtered = students.filter(s => s.batch === selectedBatch && s.name.toLowerCase().includes(search));
            tbody.innerHTML = filtered.map(s => `
                <tr>
                    <td>${s.name}</td>
                    <td>${s.roll}</td>
                    <td>
                        <button class="btn btn-present" onclick="alert('Marked Present: ${s.name}')">Present</button>
                        <button class="btn btn-absent" onclick="alert('Marked Absent: ${s.name}')">Absent</button>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
