```html
<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALGORITHMIC — Institutional Operations</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{font-family:Inter,sans-serif;background:#050505;color:#d4d4d4}.card{background:#0b0b0b;border:1px solid #1b1b1b;border-radius:12px}.input{background:#050505;border:1px solid #242424;border-radius:8px;padding:10px 12px;width:100%;outline:0;color:#eee}.input:focus{border-color:#8b6b2c}.btn{border:1px solid #292929;border-radius:8px;padding:9px 13px;font-size:12px}.gold{background:#b18a3a;color:#080808;border-color:#b18a3a;font-weight:700}.nav.active{background:#16120a;color:#d4af55;border-color:#392d18}.nav{border:1px solid transparent}.hidden{display:none!important}</style></head><body>

<div id="login" class="min-h-screen grid place-items-center p-5">
<form id="loginForm" onsubmit="login(event)" class="card p-8 w-full max-w-md space-y-5">
<div>
<div class="text-4xl font-extrabold tracking-tight text-[#c3a25b]">ALGORITHMIC</div>
<div class="text-[10px] tracking-[.3em] text-zinc-600 mt-2">INSTITUTIONAL OPERATIONS SYSTEM</div>
</div>

<input id="email" class="input" type="email" placeholder="Email" required>
<input id="password" class="input" type="password" placeholder="Password" required>

<button class="btn gold w-full">ENTER PLATFORM</button>

<p id="loginerr" class="text-red-400 text-xs"></p>

<button type="button" onclick="showSignup()" class="btn w-full text-zinc-400 hover:text-white">
CREATE ACCOUNT
</button>
</form>

<form id="signupForm" onsubmit="signup(event)" class="card p-8 w-full max-w-md space-y-5 hidden">
<div>
<div class="text-4xl font-extrabold tracking-tight text-[#c3a25b]">CREATE ACCOUNT</div>
<div class="text-[10px] tracking-[.3em] text-zinc-600 mt-2">INITIAL BOSS / OWNER ACCOUNT</div>
</div>

<input id="signupInstitute" class="input" type="text" placeholder="Institute Name" required>
<input id="signupName" class="input" type="text" placeholder="Full Name" required>
<input id="signupEmail" class="input" type="email" placeholder="Email" required>
<input id="signupPassword" class="input" type="password" placeholder="Password — minimum 8 characters" minlength="8" required>

<button class="btn gold w-full">CREATE ACCOUNT</button>

<p id="signuperr" class="text-red-400 text-xs"></p>

<button type="button" onclick="showLogin()" class="btn w-full text-zinc-400 hover:text-white">
BACK TO LOGIN
</button>
</form>
</div>

<div id="app" class="hidden min-h-screen">
<aside class="fixed left-0 top-0 bottom-0 w-64 bg-black border-r border-zinc-900 p-5 flex flex-col">
<div class="text-2xl font-extrabold tracking-tight text-[#c3a25b]">ALGORITHMIC</div>
<div id="inst" class="text-xs text-zinc-500 mt-1 mb-6 truncate"></div>
<div id="nav" class="space-y-1 flex-1"></div>
<div class="border-t border-zinc-900 pt-4">
<div id="who" class="text-xs"></div>
<div id="designation" class="text-[10px] uppercase tracking-widest text-zinc-600 mt-1"></div>
<button onclick="logout()" class="btn text-red-400 mt-3 w-full">EXIT</button>
</div>
</aside>

<main class="ml-64 p-8 min-h-screen">
<header class="mb-8">
<div class="text-[10px] uppercase tracking-[.35em] text-zinc-600">ALGORITHMIC / INSTITUTIONAL OPERATIONS</div>
<h1 id="heading" class="text-5xl font-extrabold tracking-tight text-[#c3a25b] mt-2">WELCOME</h1>
<div class="text-sm text-zinc-500 mt-2">Manage your institution without fighting your software.</div>
</header>
<div id="content"></div>
</main>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/80 z-50 p-5 grid place-items-center">
<div class="card p-6 w-full max-w-2xl max-h-[90vh] overflow-auto">
<div class="flex justify-between mb-5">
<h2 id="mtitle" class="text-xl font-bold text-[#c3a25b]"></h2>
<button onclick="closeModal()">✕</button>
</div>
<form id="mform" onsubmit="save(event)" class="space-y-3"></form>
</div>
</div>

<script>
let token=localStorage.getItem('algorithmic_token'),me,branch,branches=[],module='',editId=null,fields={students:['name','email','batch','status','roll_number','parent_contact'],teachers:['name','subject','department','contact_number'],classrooms:['room_no','capacity','building'],syllabus:['subject','semester','units','topic','teacher_name','num_lectures','lecture_date'],invigilation:['teacher_name','exam_date','room'],fees:['student_name','batch','amount_inr','status','due_date'],seating:['exam_name','exam_date','room','student_name','seat_number']};

const names={students:'STUDENTS',teachers:'TEACHERS',classrooms:'CLASSROOMS',syllabus:'SYLLABUS',timetable:'TIMETABLE',attendance:'ATTENDANCE',invigilation:'INVIGILATION',fees:'FEES',seating:'SEATING'};

async function api(url,opt={}){
opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};
let r=await fetch(url,opt);
if(!r.ok){
let e=await r.json().catch(()=>({detail:'Request failed'}));
throw Error(e.detail||'Request failed')
}
return r.json()
}

function showSignup(){
document.getElementById('loginForm').classList.add('hidden');
document.getElementById('signupForm').classList.remove('hidden');
document.getElementById('signuperr').textContent='';
}

function showLogin(){
document.getElementById('signupForm').classList.add('hidden');
document.getElementById('loginForm').classList.remove('hidden');
document.getElementById('loginerr').textContent='';
}

async function signup(e){
e.preventDefault();

const err=document.getElementById('signuperr');
err.textContent='';

try{
const payload={
institute_name:document.getElementById('signupInstitute').value.trim(),
full_name:document.getElementById('signupName').value.trim(),
email:document.getElementById('signupEmail').value.trim(),
password:document.getElementById('signupPassword').value
};

let x=await fetch('/api/auth/signup',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(payload)
});

let d=await x.json();

if(!x.ok) throw Error(d.detail||'Unable to create account');

token=d.token;
localStorage.setItem('algorithmic_token',token);

await boot();
}catch(err){
err=document.getElementById('signuperr').textContent=err.message;
}
}

async function login(e){
e.preventDefault();
try{
let x=await fetch('/api/auth/login',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
email:document.getElementById('email').value,
password:document.getElementById('password').value
})
});
let d=await x.json();
if(!x.ok)throw Error(d.detail);
token=d.token;
localStorage.setItem('algorithmic_token',token);
await boot()
}catch(err){
document.getElementById('loginerr').textContent=err.message
}
}

async function boot(){
try{
me=await api('/api/auth/me');
branches=await api('/api/branches');
branch=branches[0]?.id;
if(!branch)throw Error('No branch configured');
document.getElementById('login').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
document.getElementById('inst').textContent=me.institute_name;
document.getElementById('who').textContent=me.full_name;
document.getElementById('designation').textContent=me.designation;
buildNav();
home()
}catch(e){
localStorage.removeItem('algorithmic_token');
document.getElementById('login').classList.remove('hidden')
}
}

function allowed(m){return me.is_owner||['view','edit'].includes((me.permissions||{})[m])}
function editable(m){return me.is_owner||(me.permissions||{})[m]==='edit'}

function buildNav(){
let ms=['dashboard',...Object.keys(names),'users'];
document.getElementById('nav').innerHTML=ms.filter(m=>m==='dashboard'||m==='users'||allowed(m)).map(m=>`<button onclick="show('${m}')" class="nav w-full text-left px-3 py-2.5 rounded-lg text-xs text-zinc-400 hover:text-white">${m==='dashboard'?'DASHBOARD':m==='users'?'MANAGE USERS':names[m]}</button>`).join('')
}

function home(){show('dashboard')}

function show(m){
module=m;
document.getElementById('heading').textContent=m==='dashboard'?'WELCOME':names[m]||'MANAGE USERS';
if(m==='dashboard')dashboard();
else if(m==='users')users();
else if(m==='timetable')timetable();
else if(m==='attendance')attendance();
else renderModule(m)
}

async function dashboard(){
let d=await api('/api/dashboard?branch_id='+branch);
document.getElementById('content').innerHTML=`<div class="grid md:grid-cols-4 gap-4 mb-6">${stat('STUDENTS',d.students_by_batch.reduce((a,x)=>a+Number(x.students),0))}${stat('FEES PENDING','₹'+Number(d.fees_pending.pending).toLocaleString('en-IN'))}${stat('WEEK ATTENDANCE',d.attendance_week.reduce((a,x)=>a+Number(x.present),0)+' / '+d.attendance_week.reduce((a,x)=>a+Number(x.total),0))}${stat('ONGOING NOW',d.ongoing_lectures.length)}</div><div class="grid lg:grid-cols-2 gap-5"><div class="card p-5"><h3 class="font-bold mb-4">ATTENDANCE THIS WEEK / BATCH</h3><canvas id="ac"></canvas></div><div class="card p-5"><h3 class="font-bold mb-4">STUDENTS / BATCH</h3><canvas id="bc"></canvas></div></div><div class="card p-5 mt-5"><h3 class="font-bold mb-4">ONGOING LECTURES · ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</h3>${d.ongoing_lectures.length?d.ongoing_lectures.map(x=>`<div class="py-3 border-b border-zinc-900 flex justify-between"><span>${x.batch_name} · Lecture ${x.lecture_number} · ${x.subject}</span><span class="text-zinc-500">${x.time_slot} · ${x.teacher||''} · ${x.room||''}</span></div>`).join(''):'<div class="text-zinc-600">No lectures are currently running.</div>'}</div>`;

new Chart(document.getElementById('ac'),{
type:'bar',
data:{
labels:d.attendance_week.map(x=>x.batch||'—'),
datasets:[
{label:'Present',data:d.attendance_week.map(x=>x.present)},
{label:'Total',data:d.attendance_week.map(x=>x.total)}
]
},
options:{
plugins:{legend:{labels:{color:'#aaa'}}},
scales:{x:{ticks:{color:'#777'}},y:{ticks:{color:'#777'}}}
}
});

new Chart(document.getElementById('bc'),{
type:'doughnut',
data:{
labels:d.students_by_batch.map(x=>x.batch||'—'),
datasets:[{data:d.students_by_batch.map(x=>x.students)}]
},
options:{plugins:{legend:{labels:{color:'#aaa'}}}}
})
}

function stat(a,b){
return `<div class="card p-5"><div class="text-[10px] tracking-widest text-zinc-600">${a}</div><div class="text-2xl font-bold text-[#c3a25b] mt-2">${b}</div></div>`
}

async function renderModule(m){
let rows=await api(`/api/${m}?branch_id=${branch}`);
document.getElementById('content').innerHTML=`<div class="flex justify-between mb-4"><div class="text-sm text-zinc-500">${rows.length} records</div><div class="flex gap-2">${editable(m)?`<button class="btn gold" onclick="openForm('${m}')">+ ADD</button>`:''}<button class="btn" onclick="exporter('${m}','xlsx')">XLSX</button><button class="btn" onclick="exporter('${m}','pdf')">PDF</button></div></div><div class="card overflow-auto"><table class="w-full text-xs"><thead><tr>${(fields[m]||[]).map(x=>`<th class="text-left p-3 text-zinc-600 uppercase">${x.replaceAll('_',' ')}</th>`).join('')}<th class="p-3">ACTIONS</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-t border-zinc-900">${fields[m].map(x=>`<td class="p-3">${r[x]??''}</td>`).join('')}<td class="p-3 whitespace-nowrap">${editable(m)?`<button class="text-[#c3a25b] mr-3" onclick='openForm("${m}",${r.id},${JSON.stringify(r).replaceAll("'","&apos;")})'>EDIT</button><button class="text-red-400" onclick="del('${m}',${r.id})">DELETE</button>`:'VIEW'}</td></tr>`).join('')}</tbody></table></div>`
}

function openForm(m,id=0,row={}){
editId=id;
document.getElementById('mtitle').textContent=(id?'EDIT ':'ADD ')+names[m];
document.getElementById('mform').innerHTML=(fields[m]||[]).map(k=>`<label class="block text-xs text-zinc-500">${k.replaceAll('_',' ').toUpperCase()}<input class="input mt-1" name="${k}" value="${row[k]??''}" ${k==='date'||k.endsWith('_date')?'type=date':''}></label>`).join('')+`<button class="btn gold w-full mt-3">SAVE CHANGES</button>`;
document.getElementById('modal').classList.remove('hidden');
document.getElementById('mform').dataset.module=m
}

async function save(e){
e.preventDefault();
let m=document.getElementById('mform').dataset.module,data=Object.fromEntries(new FormData(document.getElementById('mform')));
for(let k of Object.keys(data))if(data[k]==='')delete data[k];
try{
if(editId)await api(`/api/${m}/${editId}?branch_id=${branch}`,{method:'PATCH',body:JSON.stringify({data})});
else await api(`/api/${m}?branch_id=${branch}`,{method:'POST',body:JSON.stringify({data})});
closeModal();
show(m)
}catch(err){alert(err.message)}
}

async function del(m,id){
if(confirm('Delete this record?')){
await api(`/api/${m}/${id}?branch_id=${branch}`,{method:'DELETE'});
show(m)
}
}

function closeModal(){
document.getElementById('modal').classList.add('hidden');
editId=0
}

async function attendance(){
let rows=await api('/api/attendance?branch_id='+branch);
document.getElementById('content').innerHTML=`<div class="flex justify-between mb-4">${editable('attendance')?'<button class="btn gold" onclick="attForm()">+ MARK ATTENDANCE</button>':''}<div><button class="btn" onclick="exporter('attendance','xlsx')">XLSX</button> <button class="btn" onclick="exporter('attendance','pdf')">PDF</button></div></div><div class="card overflow-auto"><table class="w-full text-xs"><thead><tr>${['Student','Batch','Date','Status','History'].map(x=>`<th class="text-left p-3 text-zinc-600">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="border-t border-zinc-900"><td class="p-3">${r.student_name}</td><td class="p-3">${r.batch||''}</td><td class="p-3">${r.date}</td><td class="p-3">${r.status}</td><td class="p-3"><button class="text-[#c3a25b]" onclick="history(${r.student_id})">VIEW HISTORY</button></td></tr>`).join('')}</tbody></table></div>`
}

function attForm(){
fields.attendance=['student_id','student_name','batch','date','status'];
openForm('attendance')
}

async function history(id){
let r=await api(`/api/students/${id}/attendance?branch_id=${branch}`);
document.getElementById('mtitle').textContent='ATTENDANCE HISTORY';
document.getElementById('mform').innerHTML=r.length?r.map(x=>`<div class="flex justify-between py-3 border-b border-zinc-900"><span>${x.date}</span><span>${x.status}</span></div>`).join(''):'<div class="text-zinc-500">No attendance history.</div>';
document.getElementById('modal').classList.remove('hidden')
}

async function timetable(){
let bs=await api('/api/timetable?branch_id='+branch+'&batch_name='+encodeURIComponent(prompt('Batch name')||''));
document.getElementById('content').innerHTML=`<div class="flex gap-2 mb-5"><button class="btn gold" onclick="generate()">REGENERATE TIMETABLE</button><button class="btn" onclick="generate()">EDIT PREREQUISITES</button></div><div class="card overflow-auto"><table class="w-full text-xs"><thead><tr>${['Day','Lecture #','Timing','Subject','Teacher','Room','Edit'].map(x=>`<th class="p-3 text-left text-zinc-600">${x}</th>`).join('')}</tr></thead><tbody>${bs.map(r=>`<tr class="border-t border-zinc-900"><td class="p-3">${r.day}</td><td class="p-3">${r.lecture_number}</td><td class="p-3">${r.time_slot}</td><td class="p-3">${r.subject}</td><td class="p-3">${r.teacher}</td><td class="p-3">${r.room}</td><td><button class="text-[#c3a25b]" onclick='editSlot(${r.id},${JSON.stringify(r)})'>EDIT</button></td></tr>`).join('')}</tbody></table></div>`
}

function editSlot(id,r){
document.getElementById('mtitle').textContent='EDIT LECTURE';
document.getElementById('mform').innerHTML=['day','time_slot','lecture_number','subject','teacher','room'].map(k=>`<label class="block text-xs text-zinc-500">${k.toUpperCase()}<input class="input mt-1" name="${k}" value="${r[k]||''}"></label>`).join('')+'<button class="btn gold w-full mt-3">SAVE</button>';
document.getElementById('mform').onsubmit=async e=>{
e.preventDefault();
let data=Object.fromEntries(new FormData(document.getElementById('mform')));
await api(`/api/timetable/${id}?branch_id=${branch}`,{method:'PATCH',body:JSON.stringify(data)});
closeModal();
timetable()
};
document.getElementById('modal').classList.remove('hidden')
}

async function generate(){
let batch=prompt('Batch name');
if(!batch)return;

let days=(prompt('Available days (comma separated)','Monday,Tuesday,Wednesday,Thursday,Friday')||'').split(',').map(x=>x.trim()).filter(Boolean),
un=(prompt('Unavailable days (comma separated, optional)','')||'').split(',').map(x=>x.trim()).filter(Boolean),
slots=(prompt('Lecture timings (comma separated)','09:00-10:00,10:00-11:00,11:15-12:15')||'').split(',').map(x=>x.trim()).filter(Boolean),
n=Number(prompt('Total lectures per week','20'));

let subjects=[];

for(let i=0;i<Number(prompt('How many subjects?','3'));i++){
let name=prompt('Subject '+(i+1));
let count=Number(prompt('Lectures per week for '+name));
let teacher=prompt('Teacher (optional)','');
subjects.push({name,lectures_per_week:count,teacher})
}

try{
await api('/api/timetable/generate?branch_id='+branch,{
method:'POST',
body:JSON.stringify({
batch_name:batch,
days,
unavailable_days:un,
slots,
lectures_per_week:n,
subjects
})
});
alert('Timetable replaced successfully.');
timetable()
}catch(e){alert(e.message)}
}

async function users(){
let rows=await api('/api/users');

document.getElementById('content').innerHTML=`<div class="flex justify-between mb-4"><div class="text-sm text-zinc-500">Boss-only user administration</div><button class="btn gold" onclick="userForm()">+ ADD USER</button></div><div class="card overflow-auto"><table class="w-full text-xs"><thead><tr><th class="p-3 text-left">NAME</th><th class="p-3 text-left">EMAIL</th><th class="p-3 text-left">DESIGNATION</th><th class="p-3 text-left">PRIVILEGES</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr class="border-t border-zinc-900"><td class="p-3">${r.full_name}</td><td class="p-3">${r.email}</td><td class="p-3">${r.designation}</td><td class="p-3">${Object.entries(r.permissions||{}).filter(([,v])=>v!=='none').map(([k,v])=>k+':'+v).join(', ')}</td><td><button class="text-[#c3a25b]" onclick='userForm(${JSON.stringify(r)})'>EDIT</button> <button class="text-red-400" onclick="removeUser(${r.id})">REVOKE</button></td></tr>`).join('')}</tbody></table></div>`
}

function userForm(r={}){
document.getElementById('mtitle').textContent=r.id?'EDIT USER':'DESIGNATE NEW USER';

document.getElementById('mform').innerHTML=`<input class="input" name="full_name" placeholder="Full name" value="${r.full_name||''}" required><input class="input" name="email" type="email" placeholder="Email" value="${r.email||''}" required><input class="input" name="password" type="password" placeholder="Password ${r.id?'(leave blank to keep)':''}" ${r.id?'':'required'}><select class="input" name="designation"><option>admin</option><option>accountant</option><option>teacher</option><option>head</option><option>custom</option></select><div class="grid grid-cols-2 gap-2">${Object.keys(names).map(m=>`<label class="text-xs"><span>${names[m]}</span><select name="p_${m}" class="input mt-1"><option value="none">No access</option><option value="view">View</option><option value="edit">Edit</option></select></label>`).join('')}</div><button class="btn gold w-full">SAVE USER & PRIVILEGES</button>`;

document.getElementById('mform').onsubmit=async e=>{
e.preventDefault();

let f=new FormData(document.getElementById('mform')),permissions={};

Object.keys(names).forEach(m=>permissions[m]=f.get('p_'+m));

let data={
full_name:f.get('full_name'),
email:f.get('email'),
designation:f.get('designation'),
permissions
};

if(f.get('password'))data.password=f.get('password');

await api(r.id?'/api/users/'+r.id:'/api/users',{
method:r.id?'PATCH':'POST',
body:JSON.stringify(data)
});

closeModal();
users()
};

document.getElementById('modal').classList.remove('hidden')
}

async function removeUser(id){
if(confirm('Revoke this user completely?')){
await api('/api/users/'+id,{method:'DELETE'});
users()
}
}

async function exporter(m,f){
location.href=`/api/export/${m}?branch_id=${branch}&format=${f}`
}

function logout(){
localStorage.removeItem('algorithmic_token');
location.reload()
}

if(token)boot();
</script>
</body></html>
```
